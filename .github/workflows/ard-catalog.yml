name: Update ARD catalog

on:
  push:
    branches: [main]
    paths:
      - apm.yml
      - "plugins/**/SKILL.md"
      - scripts/generate-ai-catalog.mjs
  pull_request:
    paths:
      - apm.yml
      - "plugins/**/SKILL.md"
      - scripts/generate-ai-catalog.mjs
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ard-catalog-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  regenerate-on-main:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-fund --no-audit
      - run: npm run generate:ard
      - name: Commit updated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .well-known/ai-catalog.json
          git diff --cached --quiet || git commit -m "chore: regenerate ai-catalog.json [skip ci]"
          git push

  # Keeps PR branches in sync too, so the catalog never drifts while a PR is open.
  check-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-fund --no-audit
      - run: npm run generate:ard
      - name: Auto-fix catalog on same-repo PR branches
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .well-known/ai-catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate ai-catalog.json [skip ci]"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Fail if catalog is stale (fork PRs can't be auto-fixed by CI)
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          git diff --exit-code .well-known/ai-catalog.json || \
            (echo "::error::.well-known/ai-catalog.json is out of date. Run 'npm run generate:ard' locally and commit the result -- CI can't push fixes back to fork branches." && exit 1)

