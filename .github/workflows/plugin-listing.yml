name: Update plugin listing

on:
  push:
    branches: [main]
    paths:
      - scripts/generate-plugins-html.mjs
      - .github/workflows/plugin-listing.yml
  pull_request:
    paths:
      - apm.yml
      - scripts/generate-plugins-html.mjs
      - .github/workflows/plugin-listing.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: plugin-release-listing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate-on-main:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-fund --no-audit
      - run: npm run generate:plugins
      - name: Commit updated plugin listing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate plugin listing and sitemap [skip ci]"
            npm run generate:sitemap
            git add sitemap.xml
            git commit --amend --no-edit
            git pull --rebase origin main
            git push
          fi

  # Keeps PR branches in sync too, so the listing never drifts while a PR is open.
  check-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-fund --no-audit
      - run: npm run generate:plugins
      - name: Auto-fix listing on same-repo PR branches
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate plugin listing and sitemap [skip ci]"
            npm run generate:sitemap
            git add sitemap.xml
            git commit --amend --no-edit
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Fail if listing is stale (fork PRs can't be auto-fixed by CI)
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          git diff --exit-code index.html || \
            (echo "::error::index.html plugin listing is out of date. Run 'npm run generate:plugins' locally and commit the result -- CI can't push fixes back to fork branches." && exit 1)
