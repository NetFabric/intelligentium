name: Plugin releases

on:
  push:
    branches: [main]
    paths:
      - apm.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: plugin-release-listing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-fund --no-audit
      - name: Create per-plugin releases for version bumps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm run release:plugins
      - name: Update website with released versions and dates
        run: |
          npm run generate:plugins
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: update plugin releases and sitemap [skip ci]"
            npm run generate:sitemap
            git add sitemap.xml
            git commit --amend --no-edit
            git pull --rebase origin main
            git push
          fi
