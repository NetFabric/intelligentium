name: Update sitemap

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - CNAME
      - scripts/generate-sitemap.mjs
  pull_request:
    paths:
      - "*.html"
      - CNAME
      - scripts/generate-sitemap.mjs
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sitemap-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  regenerate-on-main:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-fund --no-audit
      - run: npm run generate:sitemap
      - name: Commit updated sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --cached --quiet || git commit -m "chore: regenerate sitemap.xml [skip ci]"
          git push

  # Keeps PR branches in sync too, so the sitemap never drifts while a PR is open.
  check-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-fund --no-audit
      - run: npm run generate:sitemap
      - name: Auto-fix sitemap on same-repo PR branches
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate sitemap.xml [skip ci]"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Fail if sitemap is stale (fork PRs can't be auto-fixed by CI)
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          git diff --exit-code sitemap.xml || \
            (echo "::error::sitemap.xml is out of date. Run 'npm run generate:sitemap' locally and commit the result -- CI can't push fixes back to fork branches." && exit 1)
