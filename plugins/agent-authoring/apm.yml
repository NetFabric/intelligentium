name: agent-authoring
version: 0.5.0
description: Skills for authoring AGENTS.md project-context files, SKILL.md agent
  skills, building apps with the GitHub Copilot SDK, automating Copilot CLI
  in GitHub Actions, converting data to/from TOON (Token-Oriented Object
  Notation) to cut LLM token usage, and following Markdown formatting best
  practices.
author: NetFabric
license: MIT
keywords: [agents-md, skill, authoring, documentation, copilot-sdk, copilot-cli, github-actions, toon, token-oriented-object-notation, tokens, llm, markdown, formatting]
# Which agent platforms to deploy to.
# Resolution order: --target flag > this field > auto-detect from filesystem.
# Accepted values: agent-skills, antigravity, claude, codex, copilot, cursor, gemini, kiro, opencode, windsurf
targets:
- copilot
- claude
- cursor
- codex
- gemini
- windsurf
- kiro
dependencies:
  apm: []
  mcp: []
includes: auto
devDependencies:
  apm: []
scripts: {}
