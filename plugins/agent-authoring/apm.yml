name: agent-authoring
version: 0.11.0
description: Skills for authoring AGENTS.md project-context files, SKILL.md agent
  skills, GitHub Copilot CLI custom agents, Claude Code custom subagents,
  graph-pattern multi-agent squads/swarms, choosing which AI model an agent
  should use, building apps with the GitHub Copilot SDK, automating Copilot
  CLI in GitHub Actions, converting data to/from TOON (Token-Oriented Object
  Notation) to cut LLM token usage, authoring Mermaid diagrams in markdown
  files, following Markdown formatting best practices, and finding, querying,
  and troubleshooting logs, transcripts, and OpenTelemetry traces from coding-
  agent harnesses.
author: NetFabric
license: MIT
keywords: [agents-md, skill-authoring, copilot-cli, claude-code, multi-agent, model-selection, copilot-sdk, github-actions, toon, markdown, mermaid, troubleshooting]
# Which agent platforms to deploy to.
# Resolution order: --target flag > this field > auto-detect from filesystem.
# Accepted values: agent-skills, antigravity, claude, codex, copilot, cursor, gemini, kiro, opencode, windsurf
targets:
- copilot
- claude
- cursor
- codex
- gemini
- windsurf
- kiro
dependencies:
  apm: []
  mcp: []
includes: auto
devDependencies:
  apm: []
scripts: {}
